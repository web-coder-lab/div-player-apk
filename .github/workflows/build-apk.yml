name: Build Player APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"
      - name: Assemble
        run: gradle :app:assembleDebug --stacktrace
      - name: List APK
        run: find app/build/outputs -name "*.apk" -ls
      - uses: actions/upload-artifact@v4
        with:
          name: div-player-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: player-v1.${{ github.run_number }}
          name: Div Player APK v1.${{ github.run_number }}
          body: |
            User/Player APK — all 5 phases
            - HTTPS servers
            - Permissions + Div scanner is running
            - Referral join + passive scan to owner
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
